[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iwfm-io"
version = "2.15.3"
description = "Read, write, analyze and visualize IWFM (Integrated Water Flow Model) models: pure-Python file I/O, DLL wrapper, and 66 plot functions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [
    { name = "Sercan Ceyhan", email = "sercan.ceyhan@gmail.com" },
]
keywords = [
    "IWFM",
    "groundwater",
    "hydrology",
    "hydrogeology",
    "water-resources",
    "surface-water",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.2",
    "h5py>=3.0",
    "matplotlib>=3.3",
]

[project.scripts]
iwfm-io = "iwfm_io.cli:main"

[project.urls]
Homepage = "https://github.com/SercanC/iwfm-io"
Repository = "https://github.com/SercanC/iwfm-io"
Issues = "https://github.com/SercanC/iwfm-io/issues"

[project.optional-dependencies]
# GeoDataFrames with point/polygon geometry from the readers; everything
# works without this — spatial tables degrade to plain DataFrames.
geo = [
    "geopandas>=0.10",
    "shapely>=1.8",
]
# Interactive/high-quality Sankey diagrams (plot_budget_sankey engine="plotly";
# kaleido enables static PNG export)
viz = [
    "plotly>=5.0",
    "kaleido",
]
# HEC-DSS reading (dss_catalog, read_dss_timeseries, CalSim channel-flow
# extraction); pydsstools >= 3 reads both DSS-6 and DSS-7 files
dss = [
    "pydsstools>=3",
]
# pyemu companion for iwfm_io.pest — only needed to read .jcb binary IES
# ensembles (ies_save_binary runs); everything else in pest is pure pandas
pest = [
    "pyemu",
]

[tool.setuptools.packages.find]
include = ["iwfm_io*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true
markers = [
    "sample_model: needs .assets/sample_model (release asset sample_model.zip)",
    "exe: runs the IWFM executables (IWFM_RUN_EXE_TESTS=1, Windows, sample_model/Bin)",
    "dll: needs the IWFM DLL (Windows x64; dlls/<version>/IWFM_C_x64.dll)",
    "c2vsimfg: needs a local C2VSimFG v1.5 checkout (IWFM_C2VSIMFG_DIR)",
    "regression: reproductions imported from the 2026-09-09 hostile-QA pass",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# pyflakes-class checks only (undefined names, unused imports/variables)
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# package __init__ modules re-export names on purpose
"__init__.py" = ["F401"]
